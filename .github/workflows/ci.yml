name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  test-db:
    runs-on: ubuntu-latest
    services:
      atlas:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
    env:
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      OPENROUTER_API_KEY: ci-not-a-real-key
      MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      MONGODB_DB: cards_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
