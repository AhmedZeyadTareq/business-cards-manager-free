<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ac103d" />
    <title>You are offline — Business Cards Manager</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #18181b;
        font-family:
          "IBM Plex Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #52525b;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        background: #ac103d;
        color: #ffffff;
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #870c30;
      }
      button:focus-visible {
        outline: 2px solid #ac103d;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>You are offline</h1>
      <p>
        Business Cards Manager needs an internet connection. No contacts are stored on this device.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
